name: Validate dotfiles

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate-json:
    name: Validate JSON files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate winget-packages.json
        run: python3 -c "import json; json.load(open('windows/winget-packages.json'))"

      - name: Validate renovate.json
        run: python3 -c "import json; json.load(open('.github/renovate.json'))"

      - name: Validate npm manifest
        run: python3 -c "import json; json.load(open('wsl/npm/package.json'))"

  validate-toml:
    name: Validate TOML files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v5

      - name: Validate mise config
        run: mise config ls

      - name: Validate managed TOML syntax
        run: |
          python3 -c "
          import tomllib
          for path in ['mise.toml', 'wsl/mise/config.toml', 'wsl/cargo/Cargo.toml']:
              with open(path, 'rb') as f:
                  tomllib.load(f)
              print(path + ' is valid')
          "

  validate-shell:
    name: Validate shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check install.sh syntax
        run: |
          bash -n install.sh
          bash -n restore.sh
          bash -n wsl/docker/common.sh
          bash -n wsl/docker/install.sh
          bash -n wsl/docker/restore.sh
          bash -n wsl/browser/open.sh

      - name: Test WSL restoration safety
        run: bash tests/restore.sh

      - name: Test WSL prerequisites and Git failure handling
        run: bash tests/bootstrap.sh

      - name: Test Docker service-state safety
        run: bash tests/docker.sh

      - name: Test Windows browser bridge safety
        run: bash tests/browser.sh

  validate-powershell:
    name: Validate PowerShell and prompt configuration
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check PowerShell syntax and prompt JSON
        shell: pwsh
        run: |
          $files = @(
            'install.ps1',
            'windows/restore.ps1',
            'windows/terminal/settings.ps1',
            'windows/PowerShell/Microsoft.PowerShell_profile.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file), [ref]$tokens, [ref]$errors
            ) > $null
            if ($errors) { throw ($errors | Out-String) }
          }
          Get-Content windows/terminal/appearance.json -Raw | ConvertFrom-Json > $null
          Get-Content windows/terminal/preferences.json -Raw | ConvertFrom-Json > $null

      - name: Test restoration safety
        shell: pwsh
        run: |
          .\windows\tests\restore.Tests.ps1
          .\windows\tests\terminal.Tests.ps1
          .\windows\tests\profile.Tests.ps1
